name: Cloudflare Production

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PRODUCTION_URL: https://numeria-studio-site.karukimori.workers.dev
  NUMERIA_PRODUCTION_URL: https://numeria-studio-site.karukimori.workers.dev
  NUMERIA_CUSTOM_DOMAIN_URL: https://numeria-studio.com
  VITE_CLERK_APPLICATION_ID: app_3ImOuQXNBc9Rpqs3XoJEtw2NogR
  VITE_APP_VERSION: 0.3.6-report-template
  VITE_ADMIN_EMAILS: illusionddt@gmail.com
  AUTH_ENFORCEMENT_MODE: enforce
  VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY || secrets.VITE_CLERK_PUBLISHABLE_KEY }}
  CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
  NUMERIA_ADMIN_USER_IDS: ${{ vars.NUMERIA_ADMIN_USER_IDS || secrets.NUMERIA_ADMIN_USER_IDS }}
  PLATFORM_SUBSCRIPTION_INTEGRATION_SECRET: ${{ secrets.PLATFORM_SUBSCRIPTION_INTEGRATION_SECRET }}
  VITE_FEEDBACK_HUB_BASE_URL: ${{ vars.VITE_FEEDBACK_HUB_BASE_URL || secrets.VITE_FEEDBACK_HUB_BASE_URL }}
  VITE_PRICE_FREE_LABEL: ${{ vars.VITE_PRICE_FREE_LABEL || '無料' }}
  VITE_PRICE_PRO_LABEL: ${{ vars.VITE_PRICE_PRO_LABEL || '価格未設定' }}
  VITE_PRICE_BUSINESS_LABEL: ${{ vars.VITE_PRICE_BUSINESS_LABEL || '準備中' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npm test

      - run: npm run build

      - name: Require Cloudflare configuration
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret: CLOUDFLARE_API_TOKEN"
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing GitHub Actions secret: CLOUDFLARE_ACCOUNT_ID"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Add the missing secrets at: https://github.com/karukimori-wq/numeria-studio-site/settings/secrets/actions"
            exit 1
          fi

      - name: Sync secure admin identity secrets
        if: env.CLERK_SECRET_KEY != '' || env.NUMERIA_ADMIN_USER_IDS != ''
        shell: bash
        run: |
          if [ -n "$CLERK_SECRET_KEY" ]; then
            printf '%s' "$CLERK_SECRET_KEY" | npx wrangler secret put CLERK_SECRET_KEY
          fi
          if [ -n "$NUMERIA_ADMIN_USER_IDS" ]; then
            printf '%s' "$NUMERIA_ADMIN_USER_IDS" | npx wrangler secret put NUMERIA_ADMIN_USER_IDS
          fi

      - name: Sync platform subscription integration secret
        if: env.PLATFORM_SUBSCRIPTION_INTEGRATION_SECRET != ''
        shell: bash
        run: printf '%s' "$PLATFORM_SUBSCRIPTION_INTEGRATION_SECRET" | npx wrangler secret put PLATFORM_SUBSCRIPTION_INTEGRATION_SECRET

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply numeria-studio-db --remote

      - name: Deploy Worker static assets
        run: npx wrangler deploy --var VITE_CLERK_PUBLISHABLE_KEY:"$VITE_CLERK_PUBLISHABLE_KEY" --var AUTH_ENFORCEMENT_MODE:"$AUTH_ENFORCEMENT_MODE"

      - name: Verify production
        run: npm run verify:production

      - name: Verify custom domain
        run: npm run verify:custom-domain

      - name: Verify auth enforce rollout
        if: env.AUTH_ENFORCEMENT_MODE == 'enforce'
        run: npm run verify:auth-release

  record-external-intelligence:
    name: Record External Intelligence
    needs: deploy
    if: ${{ needs.deploy.result == 'success' }}
    uses: karukimori-wq/External-Intelligence-System/.github/workflows/record-development-result.yml@main
    with:
      project_id: numeria-studio-site
      app_id: numeria-studio
      component_id: site
      task_type: production-deploy
      summary: Numeria Studio Cloudflare Production workflow completed its configured test, build, deploy, Workers.dev readiness, custom-domain smoke, and auth rollout checks.
      outcome: implementation_result
      success: true
      knowledge_title: Numeria Studio production workflow completed
      knowledge_statement: The current Numeria Studio commit passed the configured Cloudflare Production workflow, including the numeria-studio.com custom-domain smoke. This is implementation/deployment evidence only; logged-in administrator entitlement behavior and complete human UI flows still require human verification.
      production_deployed: true
      ui_reachable: true
      permission_verified: false
      requires_persistence: true
      persistence_verified: false
      requires_integration: true
      integration_verified: false
      human_verified: false
      runtime: cloudflare-workers
      framework: react-vite
      database: cloudflare-d1
      auth: clerk
      environment: production
      plan_model: free-pro
      app_role: professional-studio
      contract_version: professional-platform-contracts@abf17744
      node_version: '22'
      strict: false
