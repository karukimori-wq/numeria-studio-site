name: Cloudflare Production

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PRODUCTION_URL: https://numeria-studio-site.karukimori.workers.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm test

      - run: npm run build

      - name: Require Cloudflare configuration
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret: CLOUDFLARE_API_TOKEN"
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing GitHub Actions secret: CLOUDFLARE_ACCOUNT_ID"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Add the missing secrets at: https://github.com/karukimori-wq/numeria-studio-site/settings/secrets/actions"
            exit 1
          fi

      - name: Deploy Worker static assets
        run: npx wrangler deploy

      - name: Verify production
        run: |
          sleep 5
          curl --fail --silent --show-error "$PRODUCTION_URL" | tee /tmp/index.html
          node - <<'NODE'
          const fs = require("node:fs");
          const html = fs.readFileSync("/tmp/index.html", "utf8");
          if (!html.includes("Numeria Studio")) {
            throw new Error("Production page did not include Numeria Studio marker");
          }
          NODE
