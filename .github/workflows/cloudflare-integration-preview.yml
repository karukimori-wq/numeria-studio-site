name: Cloudflare Integration Preview

on:
  workflow_dispatch:
  push:
    branches:
      - codex/site-v2-lp-v1-1-20261022

permissions:
  contents: read

concurrency:
  group: numeria-integration-preview
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PREVIEW_WORKER: numeria-studio-integration-preview
  PREVIEW_URL: https://integration-preview.numeria-studio.com
  AUTH_ENFORCEMENT_MODE: enforce
  VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY || secrets.VITE_CLERK_PUBLISHABLE_KEY }}
  VITE_ADMIN_EMAILS: illusionddt@gmail.com
  CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
  NUMERIA_ADMIN_USER_IDS: ${{ vars.NUMERIA_ADMIN_USER_IDS || secrets.NUMERIA_ADMIN_USER_IDS }}
  PLATFORM_SUBSCRIPTION_INTEGRATION_SECRET: ${{ secrets.PLATFORM_SUBSCRIPTION_INTEGRATION_SECRET }}

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npm test
      - run: npm run build

      - name: Require integration configuration
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$VITE_CLERK_PUBLISHABLE_KEY" || { echo "::error::Missing VITE_CLERK_PUBLISHABLE_KEY"; exit 1; }

      - name: Apply shared D1 migrations
        run: npx wrangler d1 migrations apply numeria-studio-db --remote

      - name: Deploy isolated noindex integration Worker
        run: >-
          npx wrangler deploy
          --name "$PREVIEW_WORKER"
          --domain integration-preview.numeria-studio.com
          --var VITE_CLERK_PUBLISHABLE_KEY:"$VITE_CLERK_PUBLISHABLE_KEY"
          --var AUTH_ENFORCEMENT_MODE:"$AUTH_ENFORCEMENT_MODE"
          --var VITE_ADMIN_EMAILS:"$VITE_ADMIN_EMAILS"
          --var NUMERIA_PREVIEW_NOINDEX:"1"

      - name: Sync Clerk and integration secrets to preview
        shell: bash
        run: |
          if [ -n "$CLERK_SECRET_KEY" ]; then
            printf '%s' "$CLERK_SECRET_KEY" | npx wrangler secret put CLERK_SECRET_KEY --name "$PREVIEW_WORKER"
          fi
          if [ -n "$NUMERIA_ADMIN_USER_IDS" ]; then
            printf '%s' "$NUMERIA_ADMIN_USER_IDS" | npx wrangler secret put NUMERIA_ADMIN_USER_IDS --name "$PREVIEW_WORKER"
          fi
          if [ -n "$PLATFORM_SUBSCRIPTION_INTEGRATION_SECRET" ]; then
            printf '%s' "$PLATFORM_SUBSCRIPTION_INTEGRATION_SECRET" | npx wrangler secret put PLATFORM_SUBSCRIPTION_INTEGRATION_SECRET --name "$PREVIEW_WORKER"
          fi

      - name: Verify preview route and auth boundary
        shell: bash
        run: |
          headers="$(curl --fail --silent --show-error --retry 8 --retry-delay 3 --head "$PREVIEW_URL/")"
          printf '%s\n' "$headers" | grep -qi '^x-robots-tag: noindex, nofollow'
          app_headers="$(curl --fail --silent --show-error --retry 8 --retry-delay 3 --head "$PREVIEW_URL/app/home")"
          printf '%s\n' "$app_headers" | grep -qi '^x-robots-tag: noindex, nofollow'
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' "$PREVIEW_URL/api/appraisals/status")"
          test "$status" = "401"
