name: Apply Growth Engine handoff patch

on:
  push:
    branches:
      - fix/growth-engine-handoff-receiver

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[handoff-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/growth-engine-handoff-receiver
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply exact source patch
        run: node scripts/apply-growth-handoff-patch.mjs

      - name: Install dependencies
        run: npm install

      - name: Verify handoff and existing contracts
        run: npm test

      - name: Verify production build
        run: npm run build

      - name: Check patch formatting
        run: git diff --check

      - name: Commit verified source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx src/worker.js
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "[handoff-patched] Wire Growth Engine handoff receiver"
          git push origin HEAD:fix/growth-engine-handoff-receiver
