name: F4 Kigaku checks
on:
  pull_request:
    paths:
      - 'src/kigaku-*.js'
      - 'src/japan-birth-clock.js'
      - 'scripts/*f4*'
      - 'scripts/*kigaku*'
      - 'test-fixtures/kigaku-*'
      - 'docs/block-editor/f4-*'
      - '.github/workflows/f4-kigaku-checks.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npm run build
