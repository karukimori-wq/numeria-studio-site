name: Character foundation (offline)
on:
  pull_request:
    paths: ['src/character-store.js', 'src/app-route-runtime.js', 'scripts/verify-character-screen.mjs', 'src/character-editor-state.js', 'scripts/verify-character-history.mjs', 'src/character-api.js', 'src/character-selection.js', 'scripts/verify-character-selection.mjs', 'migrations/0007_character_selections.sql', 'src/official-character-catalog.js', 'scripts/verify-official-characters.mjs', 'migrations/0006_official_characters.sql', 'src/worker-entry.js', 'scripts/verify-character-api.mjs', 'scripts/verify-character-integration.mjs', 'scripts/verify-character-store.mjs', 'migrations/0005_character_collections.sql', '.github/workflows/character-foundation.yml']
  push:
    branches: ['feat/character-foundation-20261028']
permissions:
  contents: read
jobs:
  sqlite-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test scripts/verify-character-store.mjs scripts/verify-character-api.mjs scripts/verify-character-integration.mjs scripts/verify-official-characters.mjs scripts/verify-character-selection.mjs scripts/verify-character-history.mjs scripts/verify-character-screen.mjs
