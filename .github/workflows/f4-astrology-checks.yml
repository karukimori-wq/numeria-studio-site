name: F4 Astrology checks
on:
  pull_request:
    paths:
      - 'src/astrology-*.js'
      - 'src/calendar-calculators.js'
      - 'src/japan-birth-time.js'
      - 'scripts/verify-astrology-*.mjs'
      - 'scripts/generate-f4-cross-branch-ledger.mjs'
      - 'test-fixtures/calendar-reference-cases.json'
      - 'test-fixtures/f4-source-audit-20261117.json'
      - '.github/workflows/f4-astrology-checks.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: node scripts/verify-astrology-page-data.mjs
      - run: node scripts/verify-astrology-references.mjs
      - run: node scripts/generate-f4-cross-branch-ledger.mjs
      - run: npm test
      - run: npm run build
