name: Clerk LP Isolated Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-auth-preview:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY || secrets.VITE_CLERK_PUBLISHABLE_KEY }}
      AUTH_ENFORCEMENT_MODE: enforce
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node scripts/verify-lp-clerk-auth.mjs
      - run: npm test
      - run: npm run build
      - name: Require credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$VITE_CLERK_PUBLISHABLE_KEY"
      - name: Create isolated LP-only worker configuration
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const raw = readFileSync('wrangler.jsonc','utf8');
          const config = JSON.parse(raw);
          config.name = 'numeria-studio-auth-preview';
          delete config.d1_databases;
          delete config.services;
          config.vars = { ...config.vars, AUTH_ENFORCEMENT_MODE: 'enforce', NUMERIA_PREVIEW_NOINDEX: '1' };
          writeFileSync('wrangler.auth-preview.json', JSON.stringify(config, null, 2));
          NODE
      - name: Deploy isolated preview (no production worker or D1 migrations)
        run: npx wrangler deploy --config wrangler.auth-preview.json --var VITE_CLERK_PUBLISHABLE_KEY:"$VITE_CLERK_PUBLISHABLE_KEY" --var AUTH_ENFORCEMENT_MODE:"$AUTH_ENFORCEMENT_MODE" --var NUMERIA_PREVIEW_NOINDEX:"1"
      - name: Print preview URL
        run: echo "Check https://numeria-studio-auth-preview.karukimori.workers.dev/ (if workers.dev enabled for this Worker)"
